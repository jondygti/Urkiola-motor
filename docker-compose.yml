# Despliegue de la fase 1: un único servidor con Docker.
# Ver docs/DESPLIEGUE.md.
#
#   cp deploy/.env.example .env   (y rellenar)
#   npm run build:web             (genera dist/)
#   docker compose up -d

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 5
    # La base de datos no se expone a internet: solo la ve la red interna.

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data

  # Descomentar cuando el backend esté escrito.
  # Debe implementar el contrato de docs/BACKEND-API.md.
  # api:
  #   build: ./server
  #   restart: unless-stopped
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   environment:
  #     DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  #     S3_ENDPOINT: http://minio:9000
  #     S3_ACCESS_KEY: ${MINIO_ROOT_USER}
  #     S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  #     JWT_SECRET: ${JWT_SECRET}

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./dist:/srv/web:ro
      - caddy-data:/data
      - caddy-config:/config

  # Copia de seguridad diaria de la base de datos, con 30 días de retención.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c 'while true; do
        pg_dump -h db -U ${POSTGRES_USER} ${POSTGRES_DB} | gzip > /backups/urkiola-$$(date +%%Y%%m%%d-%%H%%M).sql.gz;
        find /backups -name "urkiola-*.sql.gz" -mtime +30 -delete;
        sleep 86400;
      done'

volumes:
  db-data:
  minio-data:
  caddy-data:
  caddy-config:
