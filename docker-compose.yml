# Despliegue de la fase 1: un único servidor con Docker.
# Ver docs/DESPLIEGUE.md.
#
#   cp deploy/.env.example .env   (y rellenar)
#   npm run build:web             (genera dist/)
#   docker compose up -d

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 5
    # La base de datos no se expone a internet: solo la ve la red interna.

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data

  api:
    # Sin argumento EXPO_PUBLIC_API_URL: aquí el panel web lo sirve Caddy
    # desde ./dist (lo genera `npm run build:web`), no la propia API.
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      URKIOLA_ADMIN_EMAIL: ${URKIOLA_ADMIN_EMAIL}
      URKIOLA_ADMIN_PASSWORD: ${URKIOLA_ADMIN_PASSWORD}
      URKIOLA_SEMILLA: vacia
      CORS_ORIGEN: ${PUBLIC_URL}
      NODE_ENV: production
    # Una sola instancia: el servidor aplica los comandos en fila y coge un
    # cerrojo en la base de datos. Ver server/README.md.

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./dist:/srv/web:ro
      - caddy-data:/data
      - caddy-config:/config

  # Copia de seguridad diaria de la base de datos, con 30 días de retención.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c 'while true; do
        pg_dump -h db -U ${POSTGRES_USER} ${POSTGRES_DB} | gzip > /backups/urkiola-$$(date +%%Y%%m%%d-%%H%%M).sql.gz;
        find /backups -name "urkiola-*.sql.gz" -mtime +30 -delete;
        sleep 86400;
      done'

volumes:
  db-data:
  minio-data:
  caddy-data:
  caddy-config:
