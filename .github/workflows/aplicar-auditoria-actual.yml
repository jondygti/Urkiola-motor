name: Aplicar auditoría profunda

on:
  push:
    branches: [main]
    paths: ['.github/workflows/aplicar-auditoria-actual.yml']

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Aplicar correcciones reproducidas
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def repl(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'No se encontró patrón en {path}: {old[:140]!r}')
              p.write_text(s.replace(old, new, count))

          # 1) Al recoger las llaves el coche está realmente «en traslado».
          repl('src/data/commands.ts',
          """      const next: AppState = { ...state, requests: replace(state.requests, cmd.requestId, patch) };\n      return addEvent(next, {""",
          """      let next: AppState = { ...state, requests: replace(state.requests, cmd.requestId, patch) };\n      if (recoge) {\n        next = { ...next, vehicles: replace(next.vehicles, req.vehicleId, { status: 'en_traslado' }) };\n      }\n      return addEvent(next, {""")

          repl('src/data/types.ts',
          """  'traslado_solicitado',\n  'en_preparacion',""",
          """  'traslado_solicitado',\n  'en_traslado',\n  'en_preparacion',""")

          # 2) Una solicitud no se «termina» a mano: el traslado lo cierra el
          # movimiento al destino y la preparación, prep.finish.
          p = Path('server/src/permisos.ts')
          s = p.read_text()
          old = """      // Solo hacia adelante: recogido y entregado. Ni se lo asigna a otro\n      // ni se lo pasa a otra empresa.\n      const avance = cmd.status === 'en_ruta' || cmd.status === 'terminada';\n      if (!avance) return 'Solo puedes marcar la recogida y la entrega.';\n      if (cmd.assignedTo !== undefined || cmd.carrierId !== undefined) {\n        return 'No puedes reasignar un traslado.';\n      }\n      if (cmd.status === 'en_ruta' && necesitaLlavesPreparadas(s, r.id) && !r.keysReadyAt && !r.pickedUpAt) {\n        return 'Logística todavía no ha marcado las llaves como preparadas.';\n      }\n      if (cmd.status === 'terminada' && !r.pickedUpAt) {\n        return 'Primero tienes que registrar la recogida de las llaves.';\n      }\n      return null;"""
          new = """      // El transportista registra la recogida aquí. La entrega no es un\n      // estado que se pulse: la registra movement.register al llegar al destino.\n      if (cmd.status === 'terminada') {\n        return 'La entrega se registra al mover el coche hasta el destino del traslado.';\n      }\n      if (cmd.status !== 'en_ruta') return 'Solo puedes registrar la recogida de las llaves.';\n      if (cmd.assignedTo !== undefined || cmd.carrierId !== undefined) {\n        return 'No puedes reasignar un traslado.';\n      }\n      if (necesitaLlavesPreparadas(s, r.id) && !r.keysReadyAt && !r.pickedUpAt) {\n        return 'Logística todavía no ha marcado las llaves como preparadas.';\n      }\n      return null;"""
          if old not in s: raise SystemExit('No se encontró bloque externo request.update')
          s = s.replace(old, new, 1)

          old = """      const r = s.requests.find((x) => x.id === cmd.requestId);\n      if (cmd.status === 'cancelada' || r?.status === 'cancelada') return 'Usa Cancelar solicitud; una cancelación no se reabre.';\n      // En Sondika no basta con que el traslado esté asignado: Logística"""
          new = """      const r = s.requests.find((x) => x.id === cmd.requestId);\n      if (cmd.status === 'cancelada' || r?.status === 'cancelada') return 'Usa Cancelar solicitud; una cancelación no se reabre.';\n      if (!r) return 'Solicitud inexistente.';\n\n      if (r.type === 'traslado') {\n        if (!['solicitada', 'asignada', 'en_ruta'].includes(cmd.status)) {\n          return cmd.status === 'terminada'\n            ? 'El traslado se completa al registrar el movimiento que llega a su destino.'\n            : 'Ese estado no pertenece al flujo de un traslado.';\n        }\n        if (r.pickedUpAt && cmd.status !== 'en_ruta') {\n          return 'Con las llaves recogidas el traslado sigue en ruta hasta llegar al destino.';\n        }\n      } else if (!['solicitada', 'asignada', 'en_curso', 'bloqueada'].includes(cmd.status)) {\n        return cmd.status === 'terminada'\n          ? 'La solicitud se completa al finalizar la preparación.'\n          : 'Ese estado no pertenece al flujo de una preparación.';\n      }\n\n      // En Sondika no basta con que el traslado esté asignado: Logística"""
          if old not in s: raise SystemExit('No se encontró bloque interno request.update')
          s = s.replace(old, new, 1)
          s = s.replace(
            """      // El transportista sí puede mover su propio traslado, pero solo\n      // adelante: recogido y terminado. Ni lo asigna ni lo cancela.\n      const suyo = tiene(s, u, 'traslados.propios') && trasladoSuyo(s, u, cmd.requestId);\n      const avance = cmd.status === 'en_ruta' || cmd.status === 'terminada';\n      if (suyo && avance && cmd.assignedTo === undefined && cmd.carrierId === undefined) return null;""",
            """      // Un rol interno con «traslados propios» puede registrar la recogida;\n      // la entrega también se cierra únicamente mediante el movimiento físico.\n      const suyo = tiene(s, u, 'traslados.propios') && trasladoSuyo(s, u, cmd.requestId);\n      const avance = cmd.status === 'en_ruta';\n      if (suyo && avance && cmd.assignedTo === undefined && cmd.carrierId === undefined) return null;""",
            1,
          )
          p.write_text(s)

          # 3) La pantalla de gestión solo ofrece estados compatibles y el
          # histórico terminado/cancelado es de solo lectura.
          repl('app/(shell)/solicitudes.tsx',
          """      render: (r) =>\n        puedeGestionar ? (\n          <Btn small onPress={() => setEditing(r)}>""",
          """      render: (r) =>\n        puedeGestionar && r.status !== 'terminada' && r.status !== 'cancelada' ? (\n          <Btn small onPress={() => setEditing(r)}>""")
          repl('app/(shell)/solicitudes.tsx',
          """          options={Object.entries(REQUEST_STATUS_LABEL)\n            .filter(([key]) => key !== 'cancelada' && !(requiereLlaves && !llavesPreparadas && key === 'en_ruta'))\n            .map(([value, label]) => ({""",
          """          options={Object.entries(REQUEST_STATUS_LABEL)\n            .filter(([key]) => {\n              const permitido = request.type === 'traslado'\n                ? ['solicitada', 'asignada', 'en_ruta'].includes(key)\n                : ['solicitada', 'asignada', 'en_curso', 'bloqueada'].includes(key);\n              if (!permitido) return false;\n              if (request.type === 'traslado' && request.pickedUpAt && key !== 'en_ruta') return false;\n              if (requiereLlaves && !llavesPreparadas && key === 'en_ruta') return false;\n              return true;\n            })\n            .map(([value, label]) => ({""")

          # 4) El resumen de solicitudes incluye también Sondika: allí no se
          # prepara, pero sí puede ser origen/destino de traslados.
          repl('src/data/selectors.ts',
          """export function requestsBySite(s: AppState) {\n  return s.sites\n    .filter((site) => site.prepares)\n    .map((site) => {""",
          """export function requestsBySite(s: AppState) {\n  return s.sites\n    .map((site) => {""")

          # 5) Recorte por sede: targetSiteId vacío no significa «todas las sedes».
          # Los comerciales sí ven el stock de campa y sus propios coches fuera.
          p = Path('server/src/recorte.ts')
          s = p.read_text()
          s = s.replace(
            "import { avisoLeido } from '../../src/data/selectors';",
            "import { avisoLeido, can, esDelComercial } from '../../src/data/selectors';",
            1,
          )
          old = """  const suyas = new Set(u.siteIds);\n  const dentro = (siteId: Id | null | undefined) => !siteId || suyas.has(siteId);\n\n  const vehicles = s.vehicles.filter(\n    (v) => dentro(v.location?.siteId) || dentro(v.targetSiteId)\n  );"""
          new = """  const suyas = new Set(u.siteIds);\n  const campas = new Set(s.sites.filter((site) => site.kind === 'campa').map((site) => site.id));\n  const vendeCoches = can(s, u, 'flota.asignarse');\n\n  const vehicles = s.vehicles.filter((v) => {\n    const enSuSede = !!v.location?.siteId && suyas.has(v.location.siteId);\n    const vaASuSede = !!v.targetSiteId && suyas.has(v.targetSiteId);\n    // El comercial necesita ver el stock central aunque duerma en Sondika,\n    // y sus propios coches aunque estén temporalmente fuera de su sede.\n    const stockCentral = vendeCoches && !!v.location?.siteId && campas.has(v.location.siteId);\n    const cocheSuyo = vendeCoches && esDelComercial(v, u);\n    return enSuSede || vaASuSede || stockCentral || cocheSuyo;\n  });"""
          if old not in s: raise SystemExit('No se encontró recorte por sedes')
          p.write_text(s.replace(old, new, 1))

          # 6) Una preparación cancelada está cerrada, pero no está terminada
          # ni convierte el coche en apto para entrega.
          p = Path('src/features/prep/PrepPanel.tsx')
          s = p.read_text()
          old = """  const finished = (prep.runState === 'terminado' || prep.runState === 'cancelado');\n  const bloqueado = finished || !puedeEjecutar;\n  const apt = finished || (pct === 100 && prep.phase === 'apto_entrega');"""
          new = """  const terminada = prep.runState === 'terminado';\n  const cancelada = prep.runState === 'cancelado';\n  const cerrada = terminada || cancelada;\n  const bloqueado = cerrada || !puedeEjecutar;\n  const apt = !cancelada && (terminada || (pct === 100 && prep.phase === 'apto_entrega'));"""
          if old not in s: raise SystemExit('No se encontró estado de PrepPanel')
          s = s.replace(old, new, 1)
          s = s.replace("!finished && puedeEjecutar", "!cerrada && puedeEjecutar", 1)
          s = s.replace(") : finished ? (", ") : cerrada ? (", 1)
          s = s.replace(
            """            Terminada · {formatShortDuration(prep.effectiveMs)} efectivos · preparador{' '}""",
            """            {cancelada ? 'Cancelada' : 'Terminada'} · {formatShortDuration(prep.effectiveMs)} efectivos · preparador{' '}""",
            1,
          )
          p.write_text(s)

          # 7) Las invariantes no cuentan cancelaciones como trabajo abierto.
          repl('server/pruebas/invariantes.ts',
          """  for (const p of s.preparations) {\n    if (p.runState === 'terminado') continue;\n    abiertas.set(p.vehicleId, (abiertas.get(p.vehicleId) ?? 0) + 1);""",
          """  for (const p of s.preparations) {\n    if (p.runState === 'terminado' || p.runState === 'cancelado') continue;\n    abiertas.set(p.vehicleId, (abiertas.get(p.vehicleId) ?? 0) + 1);""")
          repl('server/pruebas/invariantes.ts',
          """  for (const p of s.preparations) {\n    if (p.runState === 'terminado') continue;\n    if (!s.sites.find((x) => x.id === p.siteId)?.prepares) {""",
          """  for (const p of s.preparations) {\n    if (p.runState === 'terminado' || p.runState === 'cancelado') continue;\n    if (!s.sites.find((x) => x.id === p.siteId)?.prepares) {""")
          repl('server/pruebas/invariantes.ts',
          """  for (const r of s.requests) {\n    if (r.type !== 'preparacion' || r.status === 'terminada') continue;""",
          """  for (const r of s.requests) {\n    if (r.type !== 'preparacion' || r.status === 'terminada' || r.status === 'cancelada') continue;""")

          # 8) Regresiones del flujo de llaves / cierre físico.
          p = Path('server/pruebas/llaves-traslados.test.ts')
          s = p.read_text()
          s = s.replace(
            """  assert.equal(request.pickedUpAt, at(11));\n  assert.ok(request.dueAt);""",
            """  assert.equal(request.pickedUpAt, at(11));\n  assert.ok(request.dueAt);\n  assert.equal(state.vehicles.find((v) => v.id === request.vehicleId)?.status, 'en_traslado');""",
            1,
          )
          old = """test('un transportista no puede marcar entregado un traslado sin haber recogido las llaves', () => {\n  const { state, requestId, transportista } = escenario('sondika');\n  const rechazo = puede(state, transportista, {\n    type: 'request.update',\n    requestId,\n    status: 'terminada',\n  });\n  assert.match(rechazo ?? '', /primero tienes que registrar la recogida/i);\n});"""
          new = """test('un traslado no se puede cerrar a mano: lo cierra el movimiento al destino', () => {\n  let { state, requestId, vehicleId, logistica, transportista } = escenario('sondika');\n  state = applyCommand(state, cmd({ type: 'request.update', requestId, status: 'asignada' }, logistica.id, 10));\n  state = applyCommand(state, cmd({ type: 'request.update', requestId, status: 'en_ruta' }, transportista.id, 11));\n\n  const cerrarTransportista = puede(state, transportista, { type: 'request.update', requestId, status: 'terminada' }, 12);\n  const cerrarLogistica = puede(state, logistica, { type: 'request.update', requestId, status: 'terminada' }, 12);\n  assert.match(cerrarTransportista ?? '', /mov(er|imiento).*destino|destino del traslado/i);\n  assert.match(cerrarLogistica ?? '', /movimiento.*destino|llega.*destino/i);\n\n  state = applyCommand(state, cmd({ type: 'movement.register', vehicleId, to: { siteId: 'leioa' } }, transportista.id, 12));\n  assert.equal(state.requests.find((r) => r.id === requestId)?.status, 'en_ruta', 'otra sede no lo cierra');\n\n  state = applyCommand(state, cmd({ type: 'movement.register', vehicleId, to: { siteId: 'galdakao' } }, transportista.id, 13));\n  assert.equal(state.requests.find((r) => r.id === requestId)?.status, 'terminada');\n  assert.equal(state.vehicles.find((v) => v.id === vehicleId)?.location?.siteId, 'galdakao');\n});"""
          if old not in s: raise SystemExit('No se encontró última regresión de llaves')
          p.write_text(s.replace(old, new, 1))

          # 9) Recorte por sede: prueba exactamente el agujero que se encontró.
          p = Path('server/pruebas/recorte.test.ts')
          s = p.read_text()
          s = s.replace(
            "import { CAMPOS_DEL_VEHICULO } from '../src/recorte';",
            "import { CAMPOS_DEL_VEHICULO, estadoParaSedes } from '../src/recorte';\nimport { buildSeedState } from '../../src/data/seed';",
            1,
          )
          marker = "test('el administrador lo ve todo', async (t) => {"
          extra = r'''test('targetSiteId vacío no abre a un usuario el parque de otras sedes', () => {
  const s = buildSeedState();
  const pedro = s.users.find((u) => u.id === 'u-pedro')!;
  const ajeno = s.vehicles.find((v) => v.location?.siteId === 'irun')!;
  const preparado = {
    ...s,
    vehicles: s.vehicles.map((v) => v.id === ajeno.id ? { ...v, targetSiteId: null, salesRep: null } : v),
  };
  const visto = estadoParaSedes(preparado, pedro);
  assert.equal(visto.vehicles.some((v) => v.id === ajeno.id), false);
});

test('el comercial conserva el stock central y sus coches aunque estén fuera', () => {
  const s = buildSeedState();
  const juan = s.users.find((u) => u.id === 'u-juan')!;
  const central = s.vehicles.find((v) => v.location?.siteId === 'sondika')!;
  const ajeno = s.vehicles.find((v) => v.location?.siteId === 'irun' && v.id !== central.id)!;
  const preparado = {
    ...s,
    vehicles: s.vehicles.map((v) => {
      if (v.id === central.id) return { ...v, targetSiteId: null, salesRep: null };
      if (v.id === ajeno.id) return { ...v, targetSiteId: null, salesRep: 'Otra Persona' };
      return v;
    }),
  };
  const visto = estadoParaSedes(preparado, juan);
  assert.ok(visto.vehicles.some((v) => v.id === central.id), 've el stock de la campa central');
  assert.equal(visto.vehicles.some((v) => v.id === ajeno.id), false, 'no recibe un coche ajeno de Irun');
});

'''
          if marker not in s: raise SystemExit('No se encontró marcador recorte.test')
          p.write_text(s.replace(marker, extra + marker, 1))

          # 10) Pruebas de selectores/flujo visual que faltaban.
          Path('server/pruebas/auditoria-actual.test.ts').write_text(r'''import test from 'node:test';
import assert from 'node:assert/strict';
import { buildSeedState } from '../../src/data/seed';
import { requestsBySite } from '../../src/data/selectors';
import { VEHICLE_FLOW, VEHICLE_STATUS_LABEL } from '../../src/data/types';

test('la ficha 360 contempla todos los estados logísticos del vehículo', () => {
  assert.deepEqual(new Set(VEHICLE_FLOW), new Set(Object.keys(VEHICLE_STATUS_LABEL)));
});

test('el resumen de solicitudes cuenta también traslados con Sondika como sede', () => {
  const s = buildSeedState();
  const v = s.vehicles.find((x) => x.location?.siteId !== 'sondika')!;
  s.requests.unshift({
    id: 'req-auditoria-sondika', type: 'traslado', vehicleId: v.id, siteId: 'sondika',
    from: v.location, to: { siteId: 'sondika' }, status: 'solicitada', urgent: false,
    createdAt: '2026-09-16T00:00:00.000Z', createdBy: 'u-admin', assignedTo: null,
    dueAt: null, pickedUpAt: null, deliveredAt: null, deliveredBy: null, carrierId: null,
  });
  const fila = requestsBySite(s).find((x) => x.site.id === 'sondika');
  assert.ok(fila);
  assert.ok((fila?.transfers ?? 0) >= 1);
});
''')

          # 11) La prueba Chromium sigue el flujo nuevo de llaves de extremo a extremo.
          p = Path('scripts/verify/funciones.mjs')
          s = p.read_text()
          inicio = s.index('  /* --------------------------------------------- 4 · recogida de llaves */')
          fin = s.index('  /* ------------ 12 · lo que pide el comercial llega al preparador */')
          bloque = r'''  /* --------------------------------------------- 4 · recogida de llaves */
  {
    // Mismo navegador/dispositivo para comprobar el relevo Logística → transportista.
    const { context, page, errores } = await entrarComo(browser, USUARIOS.transportista);
    await page.goto(`${BASE}/mis-traslados`, { waitUntil: 'networkidle' });
    await page.waitForTimeout(800);

    const inicial = await estadoGuardado(page);
    const target = inicial?.requests
      ?.filter((r) => r.type === 'traslado' && r.carrierId === USUARIOS.transportista.carrierId &&
        r.from?.siteId === 'sondika' && r.status !== 'terminada' && r.status !== 'cancelada' &&
        !r.keysReadyAt && !r.pickedUpAt)
      .sort((a, b) => Number(b.urgent) - Number(a.urgent) || a.createdAt.localeCompare(b.createdAt))[0];
    ok('10 · hay un traslado de Sondika esperando llaves', !!target);

    if (target) {
      const vehiculo = inicial.vehicles.find((v) => v.id === target.vehicleId);
      const ref = vehiculo?.plate ?? vehiculo?.vin8 ?? target.vehicleId;
      const cardPendiente = page.getByTestId('transfer-card').filter({ hasText: ref }).first();
      ok('10 · el transportista ve las llaves pendientes', (await cardPendiente.textContent() ?? '').includes('Llaves pendientes'));
      ok('10 · no puede recogerlas antes de tiempo', (await cardPendiente.getByText('🔑 He recogido las llaves').count()) === 0);

      await cambiarDeUsuario(context, page, USUARIOS.logistica, `${BASE}/solicitudes`);
      await page.waitForTimeout(800);
      const antesLogistica = await estadoGuardado(page);
      const cola = antesLogistica.requests
        .filter((r) => r.type === 'traslado' && r.from?.siteId === 'sondika' &&
          r.status !== 'terminada' && r.status !== 'cancelada' && !r.keysReadyAt && !r.pickedUpAt)
        .sort((a, b) => Number(b.urgent) - Number(a.urgent) || a.createdAt.localeCompare(b.createdAt));
      const indice = cola.findIndex((r) => r.id === target.id);
      ok('10 · Logística lo tiene en «Llaves por preparar»', indice >= 0);
      if (indice >= 0) {
        await page.getByText('🔑 Llaves preparadas', { exact: true }).nth(indice).click();
        await page.waitForTimeout(700);
      }
      const trasPreparar = await estadoGuardado(page);
      const preparado = trasPreparar.requests.find((r) => r.id === target.id);
      ok('10 · al prepararlas queda quién y cuándo', !!preparado?.keysReadyAt && preparado?.keysReadyBy === USUARIOS.logistica.id);

      await cambiarDeUsuario(context, page, USUARIOS.transportista, `${BASE}/mis-traslados`);
      await page.waitForTimeout(800);
      const cardLista = page.getByTestId('transfer-card').filter({ hasText: ref }).first();
      ok('11 · el transportista las ve listas', (await cardLista.textContent() ?? '').includes('Llaves listas'));
      await cardLista.getByText('🔑 He recogido las llaves').click();
      await page.waitForTimeout(700);

      const despues = await estadoGuardado(page);
      const req = despues?.requests?.find((r) => r.id === target.id);
      const coche = despues?.vehicles?.find((v) => v.id === target.vehicleId);
      const reciente = req?.pickedUpAt && Date.now() - new Date(req.pickedUpAt).getTime() < 60_000;
      const horas = req?.pickedUpAt && req?.dueAt
        ? (new Date(req.dueAt).getTime() - new Date(req.pickedUpAt).getTime()) / 3_600_000
        : 0;
      ok('11 · se guarda la hora de recogida', !!reciente);
      ok('11 · el plazo arranca ahí: 48 h justas', horas === 48, `${horas} h`);
      ok('11 · el vehículo pasa a «En traslado»', coche?.status === 'en_traslado', coche?.status ?? '');
      ok('11 · la trazabilidad habla de llaves recogidas',
        despues.events.some((e) => e.vehicleId === target.vehicleId && e.title.startsWith('Llaves recogidas')));

      await pulsar(page, 'Los llevo yo');
      await page.waitForTimeout(700);
      const cardRuta = page.getByTestId('transfer-card').filter({ hasText: ref }).first();
      ok('11 · pasa a «Los llevo yo»', (await cardRuta.textContent() ?? '').includes('En ruta'));
    }

    ok('11 · sin errores de JavaScript', errores.length === 0, errores[0] ?? '');
    await context.close();
  }

'''
          p.write_text(s[:inicio] + bloque + s[fin:])

          # 12) Tarjeta identificable para que la regresión Chromium apunte al traslado correcto.
          repl('app/(shell)/mis-traslados.tsx',
          """  return (\n    <View\n      style={{\n        borderWidth: 1,""",
          """  return (\n    <View\n      testID=\"transfer-card\"\n      style={{\n        borderWidth: 1,""")
          repl('app/(shell)/mis-traslados.tsx',
          """                Nada por recoger. Cuando logística te asigne un traslado aparecerá aquí; puedes cerrar la\n                app, que te llegará un aviso.""",
          """                Nada por recoger. Cuando logística te asigne un traslado aparecerá aquí en cuanto el\n                dispositivo sincronice.""")
          PY

      - name: Comprobar antes de guardar
        run: |
          npm ci --no-audit --no-fund
          npm --prefix server ci --no-audit --no-fund
          node --check scripts/verify/funciones.mjs
          npm run typecheck
          npm run server:test
          npm run test:sync

      - name: Guardar correcciones probadas
        run: |
