name: Aplicar auditoría profunda

on:
  push:
    branches: [main]
    paths: ['.github/workflows/aplicar-auditoria-actual.yml']

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Aplicar correcciones reproducidas
        run: |
          python .github/scripts/aplicar_auditoria_actual.py
          python .github/scripts/corregir_prep_panel_auditoria.py
      - name: Comprobar antes de guardar
        run: |
          npm ci --no-audit --no-fund
          npm --prefix server ci --no-audit --no-fund
          node --check scripts/verify/funciones.mjs
          npm run typecheck
          npm run server:test
          npm run test:sync
      - name: Guardar correcciones probadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/commands.ts src/data/types.ts src/data/selectors.ts server/src/permisos.ts server/src/recorte.ts server/pruebas/invariantes.ts server/pruebas/llaves-traslados.test.ts server/pruebas/recorte.test.ts server/pruebas/auditoria-actual.test.ts 'app/(shell)/solicitudes.tsx' 'app/(shell)/mis-traslados.tsx' src/features/prep/PrepPanel.tsx scripts/verify/funciones.mjs
          git commit -m "Corregir hallazgos de la auditoría profunda"
          git push origin HEAD:main
