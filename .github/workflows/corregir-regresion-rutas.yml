name: Corregir regresión rutas

on:
  push:
    branches: [main]
    paths: ['.github/workflows/corregir-regresion-rutas.yml']

permissions:
  contents: write

jobs:
  corregir:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Ajustar regresión al flujo actual de llaves
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/verify/funciones.mjs')
          s = p.read_text()
          old = "    ok('21 · conserva la recogida de llaves dentro del grupo', await page.getByText('🔑 He recogido las llaves', { exact: true }).first().isVisible());"
          new = "\n".join([
              "    const grupoTexto = await grupos.first().innerText();",
              "    const conservaLlaves =",
              "      grupoTexto.includes('🔑 He recogido las llaves') ||",
              "      grupoTexto.includes('Llaves pendientes') ||",
              "      grupoTexto.includes('Llaves listas') ||",
              "      grupoTexto.includes('Logística está preparando las llaves');",
              "    ok('21 · conserva el flujo de llaves dentro del grupo', conservaLlaves, grupoTexto);",
          ])
          if old not in s:
              raise SystemExit('No se encontró la aserción antigua')
          p.write_text(s.replace(old, new, 1))
          PY
          node --check scripts/verify/funciones.mjs
      - name: Guardar corrección
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify/funciones.mjs
          git commit -m "Ajustar regresión de agrupación al flujo de llaves"
          git push origin HEAD:main
