name: Aplicar trazabilidad de llaves

on:
  push:
    branches: [main]
    paths: ['.github/workflows/aplicar-flujo-llaves.yml']

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Ajustar flujo y regresiones
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def reemplaza(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'No se encontró patrón en {path}: {old[:100]!r}')
              p.write_text(s.replace(old, new, 1))

          # Dominio: la preparación de llaves es un hecho explícito, no una
          # interpretación del estado genérico «asignada».
          reemplaza('src/data/commands.ts',
          """        dueAt,\n        pickedUpAt: null,\n        deliveredAt: null,""",
          """        dueAt,\n        keysReadyAt: null,\n        keysReadyBy: null,\n        pickedUpAt: null,\n        deliveredAt: null,""")

          reemplaza('src/data/commands.ts',
          """      if (req.deliveredAt && cmd.status !== 'terminada' && cmd.at < req.deliveredAt) {\n        return state;\n      }\n\n      // Al recoger las llaves arranca el plazo del transportista.\n      const recoge = req.type === 'traslado' && cmd.status === 'en_ruta' && !req.pickedUpAt;\n      const patch: Partial<ServiceRequest> = {\n        status: cmd.status,\n        assignedTo: cmd.assignedTo !== undefined ? cmd.assignedTo : req.assignedTo,\n        carrierId: cmd.carrierId !== undefined ? cmd.carrierId : req.carrierId,\n      };\n      if (recoge) {""",
          """      if (req.deliveredAt && cmd.status !== 'terminada' && cmd.at < req.deliveredAt) {\n        return state;\n      }\n\n      const origenSondika =\n        req.from?.siteId === 'sondika' ||\n        state.sites.find((site) => site.id === req.from?.siteId)?.name.trim().toLowerCase() === 'sondika';\n\n      // Una asignación antigua no demuestra que las llaves estén listas. El\n      // hecho queda fechado y firmado expresamente en la propia solicitud.\n      // Tampoco se puede volver a la fase previa una vez recogidas.\n      if (req.type === 'traslado' && req.pickedUpAt && cmd.status === 'asignada') return state;\n\n      const preparaLlaves =\n        req.type === 'traslado' && origenSondika && cmd.status === 'asignada' && !req.keysReadyAt && !req.pickedUpAt;\n\n      // Esta regla vive también en la lógica compartida, no solo en permisos:\n      // un cliente offline no debe poder ponerse «en ruta» localmente antes\n      // de que Logística haya confirmado las llaves.\n      if (req.type === 'traslado' && origenSondika && cmd.status === 'en_ruta' && !req.keysReadyAt && !req.pickedUpAt) {\n        return state;\n      }\n\n      // Al recoger las llaves arranca el plazo del transportista.\n      const recoge = req.type === 'traslado' && cmd.status === 'en_ruta' && !req.pickedUpAt;\n      const patch: Partial<ServiceRequest> = {\n        status: cmd.status,\n        assignedTo: cmd.assignedTo !== undefined ? cmd.assignedTo : req.assignedTo,\n        carrierId: cmd.carrierId !== undefined ? cmd.carrierId : req.carrierId,\n      };\n      if (preparaLlaves) {\n        patch.keysReadyAt = cmd.at;\n        patch.keysReadyBy = cmd.userId;\n      }\n      if (recoge) {""")

          reemplaza('src/data/commands.ts',
          """        title: recoge\n          ? `Llaves recogidas · empiezan ${state.config.transferDeadlineHours} h`\n          : `Solicitud ${REQUEST_STATUS_LABEL[cmd.status].toLowerCase()}`,\n        detail: `${req.type === 'traslado' ? 'Traslado' : 'Preparación'} · ${userName(state, cmd.userId)}`,""",
          """        title: recoge\n          ? `Llaves recogidas · empiezan ${state.config.transferDeadlineHours} h`\n          : preparaLlaves\n            ? 'Llaves preparadas'\n            : `Solicitud ${REQUEST_STATUS_LABEL[cmd.status].toLowerCase()}`,\n        detail: preparaLlaves\n          ? `Leioa · Logística · ${userName(state, cmd.userId)}`\n          : `${req.type === 'traslado' ? 'Traslado' : 'Preparación'} · ${userName(state, cmd.userId)}`,""")

          # Seguridad backend: nunca inferir «listas» solo de status=asignada.
          reemplaza('server/src/permisos.ts',
          """ * Los coches de Sondika tienen las llaves en Logística de Leioa. Para esos\n * traslados, «asignada» significa que Logística ya las ha preparado y el\n * transportista puede pasar a recogerlas.\n */""",
          """ * Los coches de Sondika tienen las llaves en Logística de Leioa. Para esos\n * traslados el hecho fiable es `keysReadyAt`: una asignación antigua o un\n * cambio de responsable no cuenta como preparación de llaves.\n */""")
          reemplaza('server/src/permisos.ts',
          """      if (cmd.status === 'en_ruta' && necesitaLlavesPreparadas(s, r.id) && r.status !== 'asignada' && !r.pickedUpAt) {\n        return 'Logística todavía no ha marcado las llaves como preparadas.';\n      }""",
          """      if (cmd.status === 'en_ruta' && necesitaLlavesPreparadas(s, r.id) && !r.keysReadyAt && !r.pickedUpAt) {\n        return 'Logística todavía no ha marcado las llaves como preparadas.';\n      }""")
          reemplaza('server/src/permisos.ts',
          """      // Para los coches de Sondika, el paso «asignada» es deliberado: indica\n      // que Logística ya ha preparado las llaves en Leioa. Ni la oficina ni\n      // un cliente manipulado pueden saltar directamente a «en ruta».\n      if (cmd.status === 'en_ruta' && r && necesitaLlavesPreparadas(s, r.id) && r.status !== 'asignada' && !r.pickedUpAt) {\n        return 'Marca primero las llaves como preparadas.';\n      }""",
          """      // En Sondika no basta con que el traslado esté asignado: Logística\n      // tiene que haber dejado constancia expresa de que las llaves están listas.\n      if (cmd.status === 'en_ruta' && r && necesitaLlavesPreparadas(s, r.id) && !r.keysReadyAt && !r.pickedUpAt) {\n        return 'Marca primero las llaves como preparadas.';\n      }""")

          # Oficina / Logística.
          reemplaza('app/(shell)/solicitudes.tsx',
          ".filter((r) => esTrasladoDesdeSondika(r) && r.status === 'solicitada')",
          ".filter((r) => esTrasladoDesdeSondika(r) && r.status !== 'terminada' && r.status !== 'cancelada' && !r.keysReadyAt && !r.pickedUpAt)")
          reemplaza('app/(shell)/solicitudes.tsx',
          "esTrasladoDesdeSondika(r) && r.status === 'solicitada'\n              ? '🔑 Por preparar'",
          "esTrasladoDesdeSondika(r) && !r.keysReadyAt && !r.pickedUpAt\n              ? '🔑 Por preparar'")
          reemplaza('app/(shell)/solicitudes.tsx',
          """        esTrasladoDesdeSondika(r) && r.status === 'solicitada' ? (\n          <Cell>🔑 Llaves por preparar</Cell>\n        ) : esTrasladoDesdeSondika(r) && r.status === 'asignada' ? (\n          <Cell>🔑 Llaves listas</Cell>""",
          """        esTrasladoDesdeSondika(r) && !r.keysReadyAt && !r.pickedUpAt ? (\n          <Cell>🔑 Llaves por preparar</Cell>\n        ) : esTrasladoDesdeSondika(r) && !!r.keysReadyAt && !r.pickedUpAt ? (\n          <Cell>🔑 Llaves listas</Cell>""")
          reemplaza('app/(shell)/solicitudes.tsx',
          "const llavesPreparadas = !requiereLlaves || request.status === 'asignada' || !!request.pickedUpAt;",
          "const llavesPreparadas = !requiereLlaves || !!request.keysReadyAt || !!request.pickedUpAt;")
          reemplaza('app/(shell)/solicitudes.tsx',
          "{requiereLlaves && request.status === 'solicitada' ? (",
          "{requiereLlaves && !request.keysReadyAt && !request.pickedUpAt ? (")
          reemplaza('app/(shell)/solicitudes.tsx',
          """          ) : requiereLlaves && request.status === 'asignada' ? (\n            <Notice>\n              Llaves listas en Leioa · Logística. El transportista ya puede recogerlas.\n            </Notice>""",
          """          ) : requiereLlaves && request.keysReadyAt ? (\n            <Notice>\n              Llaves listas en Leioa · Logística desde {formatDateTime(request.keysReadyAt)}\n              {request.keysReadyBy ? ` · ${userName(state, request.keysReadyBy)}` : ''}. El transportista ya puede recogerlas.\n            </Notice>""")
          reemplaza('app/(shell)/solicitudes.tsx',
          "label: requiereLlaves && value === 'asignada' ? 'Llaves listas' : label,",
          "label: requiereLlaves && request.keysReadyAt && value === 'asignada' ? 'Llaves listas' : label,")

          # Transportista.
          reemplaza('app/(shell)/mis-traslados.tsx',
          "const llavesListas = !requiereLlavesDeLeioa || request.status === 'asignada' || !!request.pickedUpAt;",
          "const llavesListas = !requiereLlavesDeLeioa || !!request.keysReadyAt || !!request.pickedUpAt;")
          reemplaza('app/(shell)/mis-traslados.tsx',
          "🔑 Llaves listas en Leioa · Logística. Recógelas antes de ir a por el coche a Sondika.",
          "🔑 Llaves listas en Leioa · Logística{request.keysReadyAt ? ` desde ${formatDateTime(request.keysReadyAt)}` : ''}. Recógelas antes de ir a por el coche a Sondika.")

          # Regresiones: quién/cuándo y compatibilidad con solicitudes viejas.
          reemplaza('server/pruebas/llaves-traslados.test.ts',
          """  state = applyCommand(state, preparar);\n  assert.equal(state.requests.find((r) => r.id === requestId)?.status, 'asignada');\n\n  const recoger""",
          """  state = applyCommand(state, preparar);\n  const preparada = state.requests.find((r) => r.id === requestId)!;\n  assert.equal(preparada.status, 'asignada');\n  assert.equal(preparada.keysReadyAt, at(10));\n  assert.equal(preparada.keysReadyBy, logistica.id);\n\n  const recoger""")

          p = Path('server/pruebas/llaves-traslados.test.ts')
          s = p.read_text()
          marker = "test('un traslado desde otra sede conserva el flujo anterior y puede recoger directamente', () => {"
          extra = """test('un traslado antiguo asignado sin keysReadyAt sigue pendiente de llaves', () => {\n  const { state, requestId, transportista } = escenario('sondika');\n  const antiguo = {\n    ...state,\n    requests: state.requests.map((r) => r.id === requestId ? { ...r, status: 'asignada' as const, keysReadyAt: undefined, keysReadyBy: undefined } : r),\n  };\n  const rechazo = puede(antiguo, transportista, { type: 'request.update', requestId, status: 'en_ruta' });\n  assert.match(rechazo ?? '', /todavía no ha marcado las llaves como preparadas/i);\n});\n\n"""
          if marker not in s:
              raise SystemExit('No se encontró marcador para regresión legacy')
          p.write_text(s.replace(marker, extra + marker, 1))
          PY

      - name: Comprobar antes de guardar
        run: |
          npm ci --no-audit --no-fund
          npm --prefix server ci --no-audit --no-fund
          npm run typecheck
          npm run server:test
          npm run test:sync
      - name: Guardar ajuste probado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/commands.ts server/src/permisos.ts 'app/(shell)/solicitudes.tsx' 'app/(shell)/mis-traslados.tsx' server/pruebas/llaves-traslados.test.ts
          git commit -m "Completar trazabilidad del flujo de llaves"
          git push origin HEAD:main
